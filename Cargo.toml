[workspace]
members = [".", "crates/bork_runtime"]
resolver = "2"

[package]
name = "bork"
version = "0.1.0"
edition = "2021"
default-run = "bork"

[[bin]]
name = "bork-lsp"
path = "src/bin/bork_lsp.rs"
required-features = ["lsp"]

[features]
default = ["lsp"]
lsp = ["dep:tower-lsp", "dep:tokio", "dep:serde_json"]
codegen = ["dep:inkwell", "dep:tempfile"]

[dependencies]
inkwell = { version = "0.10", features = ["llvm18-1-prefer-dynamic"], optional = true }
lalrpop-util = "0.23"
tempfile = { version = "3", optional = true }
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"], optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
lalrpop = "0.23"
