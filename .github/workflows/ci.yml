name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Jobs below build without the `codegen` feature. `--features codegen` needs
# apt packages `llvm-18-dev` and `clang` (Ubuntu's LLVM 18 lacks libPolly.a, so
# Inkwell links libLLVM-18.so via `llvm18-1-prefer-dynamic`).

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Test without LSP feature
        run: cargo test --no-default-features --verbose

      - name: Build bork-lsp
        run: cargo build --bin bork-lsp --verbose

  codegen:
    name: Test LLVM codegen
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 and clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm-18-dev clang

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with codegen
        run: cargo test --features codegen --verbose
